services:
  db:
    image: postgres:16-alpine
    container_name: spending-tracker-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # host:container (optional to expose)
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: spending-tracker-backend
    # environment:
    #   APP_ENVIRONMENT: ${APP_ENVIRONMENT}
    #   AUTH_MODE: ${AUTH_MODE}
    #   STORAGE_BACKEND: ${STORAGE_BACKEND}
    #   TEST_USER_ID: ${TEST_USER_ID}
    #   DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    #   LOCAL_STORAGE_ROOT: ${LOCAL_STORAGE_ROOT}
    #   STATEMENTS_STORAGE_BUCKET: ${STATEMENTS_STORAGE_BUCKET}
    #   FRONTEND_URL: ${FRONTEND_URL}
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      # Persist local storage files on the host
      - local_storage:/data/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spending-tracker-frontend
    # environment:
    #   VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    #   VITE_AUTH_MODE: ${VITE_AUTH_MODE}
    #   VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
    #   VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    env_file:
      - ./frontend/.env.docker
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  local_storage: