name: Backend Flow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Set up environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync
      - name: Announce Start
        run: echo "Starting CI Flow"
      - name: Run mypy
        run: uv run mypy app
      - name: Run linter
        run: uv run ruff check app --fix
      - name: Run formatter
        run: uv run ruff format app --check


  testing:
    runs-on: ubuntu-latest

    env:
      APP_ENVIRONMENT: "TEST"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Set up environment
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync
      - name: Announce Start
        run: echo "Starting Testing Flow"
      - name: Unit testing
        run: uv run pytest tests/unit
      - name: API Integration Testing
        run: uv run pytest tests/integration
