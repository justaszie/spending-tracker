[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spending-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "currencyconverter>=0.18.13",
    "fastapi[standard]>=0.123.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.251219",
    "psycopg2>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "supabase>=2.25.0",
    "uvicorn>=0.38.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
    "types-openpyxl>=3.1.5.20250919",
]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
# Set line length (matches Black's default)
line-length = 88
# Target Python version
target-version = "py313"

[tool.ruff.lint]
# Standard rule set used in best Python codebases
select = [
    "E",      # pycodestyle errors (indentation, whitespace, etc.)
    "W",      # pycodestyle warnings (whitespace issues)
    "F",      # Pyflakes (unused imports, undefined names, etc.)
    "I",      # isort (import sorting)
    "N",      # pep8-naming (naming conventions)
    "UP",     # pyupgrade (modernize Python syntax)
    "B",      # flake8-bugbear (common bugs and design problems)
    "SIM",    # flake8-simplify (code simplification)
    "C4",     # flake8-comprehensions (better comprehensions)
    "PIE",    # flake8-pie (misc improvements)
    "T20",    # flake8-print (detect print statements)
    "PT",     # flake8-pytest-style (pytest best practices)
    "RET",    # flake8-return (return statement best practices)
    "ARG",    # flake8-unused-arguments (unused function arguments)
    "PTH",    # flake8-use-pathlib (use pathlib instead of os.path)
    "RUF",    # Ruff-specific rules
    "ERA",    # eradicate (commented out code)
]

# Ignore specific rules if needed
ignore = [
    "E501",   # Line too long (handled by formatter)
    "T201",   # Print statements (useful for debugging, can be strict)
]

[tool.ruff.lint.isort]
# Configure import sorting style
known-first-party = ["app"]
split-on-trailing-comma = true
# Separate import styles: straight imports (import x) come before from imports (from x import y)
from-first = true
# This is the standard convention and isort's default behavior
force-single-line = false

[tool.ruff.lint.mccabe]
# Maximum complexity (default: 10)
max-complexity = 10

[tool.coverage.run]
omit = [
    "tests/*",
    "throwaway/*",
    "app/**/__init__.py",
]